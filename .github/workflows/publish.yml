# Publishes the extension when a version tag is pushed (git tag v0.5.0 && git push origin v0.5.0),
# or by hand from the Actions tab. Needs the repository secret VSCE_PAT (Azure DevOps token with
# Marketplace → Manage scope). OVSX_PAT is optional: when set, the same .vsix also goes to Open VSX.
name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npx vsce package --no-dependencies --out dockdb.vsix
      - name: Publish to the VS Code Marketplace
        run: npx vsce publish --no-dependencies --packagePath dockdb.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx@0.10.1 publish dockdb.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
      - name: Attach the .vsix to a GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$GITHUB_REF_NAME" dockdb.vsix --title "$GITHUB_REF_NAME" --notes "See [CHANGELOG.md](CHANGELOG.md)."
        env:
          GH_TOKEN: ${{ github.token }}
